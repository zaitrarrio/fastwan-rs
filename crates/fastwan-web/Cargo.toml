[package]
name = "fastwan-web"
version = "0.1.0"
edition = "2024"
description = "FastWan in the browser: the WebGPU backend behind a wasm-bindgen API for Prompt Studio."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fastwan-core = { version = "0.1.0", path = "../fastwan-core" }
fastwan-model = { version = "0.1.0", path = "../fastwan-model" }
fastwan-wgpu = { version = "0.1.0", path = "../fastwan-wgpu" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
