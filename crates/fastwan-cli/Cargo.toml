[package]
name = "fastwan-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fastwan-core = { version = "0.1.0", path = "../fastwan-core" }
fastwan-cpu = { version = "0.1.0", path = "../fastwan-cpu" }
fastwan-cuda = { version = "0.1.0", path = "../fastwan-cuda", optional = true }
fastwan-model = { version = "0.1.0", path = "../fastwan-model" }
fastwan-text = { version = "0.1.0", path = "../fastwan-text" }
fastwan-wgpu = { version = "0.1.0", path = "../fastwan-wgpu" }
safetensors = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"

[features]
default = []
# `cuda` binds cudarc to CUDA 12.8, `cuda-13` to CUDA 13 (fastvideo-studio's
# image); the libraries are loaded at run time either way.
cuda = ["dep:fastwan-cuda", "fastwan-cuda/cuda-12"]
cuda-13 = ["dep:fastwan-cuda", "fastwan-cuda/cuda-13"]

[[bin]]
name = "fastwan"
path = "src/main.rs"
